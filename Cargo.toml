[package]
name = "bsg-001"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "Command line interface to connect to FTLab Wireless Smart Geiger BSG-001."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[lib]
name = "bsg_001"
path = "src/lib.rs"

[dependencies]
btleplug = "~0.13"
clap = { version = "~4", features = ["derive"] }
futures-util = "0.3.34"
tokio = { version = "~1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "~0.2", features = ["vendored"] }

[dev-dependencies]
libtest-mimic = "~0.8"
syn = { version = "~3", features = ["full", "visit"] }
varar = "~0.8"
varar-cargotest = "~0.8"
varar-config = "~0.8"
varar-core = "~0.8"
varar-runner = "~0.8"

[[test]]
name = "oaths"
path = "tests/oaths.rs"
harness = false
