# Dependabot opens pull requests for new releases of the dependencies it can manage.
# It cannot read mise.toml, so the tools pinned there are updated by hand with `mise upgrade`.
version: 2

updates:
  # The crates in Cargo.toml and Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # The same three-day cooldown as mise and Cargo: a release is not proposed until it is three days old.
    cooldown:
      default-days: 3
    groups:
      # Minor and patch releases arrive in one pull request; a major release gets its own.
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # The actions used by the workflows, which are pinned to a commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
