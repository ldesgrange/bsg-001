name: CI

# Every push runs the checks, whatever the branch.
# Pull requests are not a trigger of their own: their commits are already checked when they are pushed.
on: push

# A new push to a branch cancels the run still in progress for that branch.
# On main, the run in progress finishes first, so that it never stops while publishing the manual; a newer pending run replaces an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Checks and executable specifications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The checks need Rust, cargo-audit, gitleaks, jactionlint and shellcheck only.
      # Without this, the first `mise run` would install every other tool of mise.toml.
      MISE_DISABLE_TOOLS: pre-commit,gh,opencode,claude-code
    steps:
      # Actions are pinned to a commit, with the release it belongs to as a comment.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools are installed at the versions mise.lock records.
      - name: Install the toolchain with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          minimum_release_age: 3d

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The steps below are the tasks of `mise run check`, run one by one so that a failure names its step.
      - name: Check the formatting
        run: mise run format-check

      - name: Lint
        run: mise run lint

      - name: Lint the workflows
        run: mise run lint-actions

      - name: Check the layer boundaries
        run: mise run architecture

      # Every test that needs no hardware, with the specifications run against fake devices.
      - name: Run the tests and the executable specifications
        id: tests
        run: mise run tests

      # On main, the manual is published with the results of the run above, failures included.
      # It is written only when the specifications ran, whether they passed or not.
      - name: Write the manual with the results of its examples
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.tests.outcome != 'skipped' }}
        run: mise run specs-report

      - name: Upload the manual for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/specs-report

      - name: Audit the dependencies
        run: mise run audit

      - name: Scan for secrets
        run: mise run secrets

  # Publishes the manual built by the checks: no branch holds the site, so there is nothing to keep in sync.
  pages:
    name: Publish the manual
    needs: check
    # The manual is published even when an example failed, to show it.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the manual to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
