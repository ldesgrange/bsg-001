default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: secrets
        name: secret scan
        entry: mise run secrets
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: format-check
        name: format check
        entry: mise run format-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lint
        name: lint
        entry: mise run lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lint-actions
        name: workflow lint
        entry: mise run lint-actions
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: architecture
        name: architecture check
        entry: mise run architecture
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: audit
        name: dependency audit
        entry: mise run audit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
